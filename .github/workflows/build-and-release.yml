name: AquaOS Build & Release Pipeline

on:
  push:
    branches:
      - main
      - 'v*.*.*'
      - 'v*'
      - 'release/**'
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag / Version (e.g. v0.0.1). Leave blank for auto-detection.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Information
        id: release_info
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"
          $inputTag = "${{ inputs.release_tag }}"

          $target = if ($inputTag) { $inputTag } elseif ($refName) { $refName } else { $ref }
          Write-Host "Evaluating target for release: $target"

          # Matches pattern vx.x.x (e.g. v0.0.1, v1.0.0, v2.1.3, v0.0.1-rc1)
          if ($target -match 'v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?') {
            $tag = $Matches[0]
            Write-Host "Matched vx.x.x release pattern: $tag"
            "is_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Target '$target' does not match vx.x.x release pattern."
            "is_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tag_name=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Setup MSBuild and Developer Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build AquaOS Release Targets
        run: |
          cmake --build build --config Release --target ALL_BUILD -j

      - name: Package Standalone Distribution & Setup Installer
        shell: cmd
        run: |
          call .\scripts\package.bat ${{ steps.release_info.outputs.tag_name }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AquaOS-Windows-x64-Distribution
          path: |
            dist/*.zip
            dist/*.exe

      - name: Publish GitHub Release
        if: steps.release_info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: AquaOS ${{ steps.release_info.outputs.tag_name }}
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
